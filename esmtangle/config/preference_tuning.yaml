data:
  preference_csv_path: /project/hggroup/puqing/esmknot/data/preference_data/preference_data_merged.csv
  preference_pdb_dir: /project/hggroup/puqing/esmknot/data/preference_data/preference_data_pdb
  preference_processed_dir: /project/hggroup/puqing/esmknot/data/preference_data/preference_data_processed
  max_chain_length: 512
  val_ratio: 0.01
  seed: 42
  num_workers: 0

model:
  name: esm3-open
  use_lora: true
  lora:
    r: 256
    alpha: 512
    dropout: 0.1
    use_rslora: false

experiment:
  project: esmknot
  name: esmknot_${experiment.loss}_${now:Y%Y-M%m-D%d_%H-%M-%S}_r${model.lora.r}
  log_dir: /project/hggroup/puqing/esmknot/result/${experiment.name}
  lora_ckpt: null
  start_ckpt: /home/pdengad/esmknot/weights/lora-130000.pt

  loss: dpo  # choose from dpo (beta 0.1), irpo (alpha0.8, beta0.05), or tdpo (beta 0.1, alpha 0.5)
  loss_param:
    beta: 0.05
    alpha: 0.3

  global_batch_size: 32
  accumulate_steps: 2
  warmup_steps: 1000
  lr: 0.0001
  epochs: 12

  adamW_betas:
  - 0.9
  - 0.95
  adamW_weight_decay: 0.01

  save_and_eval_interval: 2000
  log_interval: 200
  mixed_precision: true
  max_grad_norm: 1.0
  use_wandb: true


hydra:
  run:
    dir: "${experiment.log_dir}"
  job:
    chdir: True